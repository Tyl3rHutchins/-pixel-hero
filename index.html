<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel Hero - Level 1 Test Build 1.2</title>
<style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
  overscroll-behavior:none;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  position:fixed;
  inset:0;
}
#gameShell{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
}
canvas{
  display:block;
  background:#69c6ff;
  image-rendering:pixelated;
  -webkit-touch-callout:none;
  user-select:none;
}
#hud{
  position:fixed;
  z-index:10;
  top:calc(var(--safe-top) + 8px);
  left:calc(var(--safe-left) + 10px);
  color:#fff;
  font-weight:800;
  font-size:14px;
  text-shadow:2px 2px #000;
  pointer-events:none;
}
#touchControls{
  position:fixed;
  z-index:20;
  left:calc(var(--safe-left) + 14px);
  right:calc(var(--safe-right) + 14px);
  bottom:calc(var(--safe-bottom) + 14px);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  pointer-events:none;
}
.group{
  display:flex;
  gap:9px;
  pointer-events:auto;
  align-items:flex-end;
}
.btn{
  width:64px;
  height:64px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,.72);
  background:linear-gradient(rgba(32,38,48,.72),rgba(7,10,15,.72));
  box-shadow:0 5px 0 rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.18);
  color:#fff;
  font-size:27px;
  font-weight:900;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  user-select:none;
  transition:transform .05s, box-shadow .05s, background .05s;
}
.btn.active,.btn:active{
  transform:translateY(4px) scale(.97);
  box-shadow:0 1px 0 rgba(0,0,0,.4), inset 0 1px 4px rgba(0,0,0,.35);
  background:rgba(48,58,72,.88);
}
#downBtn{
  width:56px;
  height:56px;
  font-size:22px;
  opacity:.9;
}
#jumpBtn{
  width:88px;
  height:88px;
  border-radius:50%;
  font-size:17px;
  letter-spacing:.5px;
  background:linear-gradient(rgba(117,56,211,.88),rgba(72,26,150,.9));
}
#restartBtn{
  position:fixed;
  z-index:30;
  top:calc(var(--safe-top) + 8px);
  right:calc(var(--safe-right) + 10px);
  width:auto;
  min-width:74px;
  height:40px;
  padding:0 12px;
  border-radius:12px;
  border:2px solid rgba(255,255,255,.72);
  background:rgba(0,0,0,.48);
  color:#fff;
  font-weight:900;
  font-size:13px;
  letter-spacing:.3px;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
@media (min-width:900px) and (pointer:fine){
  #touchControls{display:none}
}
</style>
</head>
<body>
<div id="gameShell"><canvas id="game"></canvas></div>
<div id="hud">LOADING…</div>
<button id="restartBtn" aria-label="Restart level">↻ RESTART</button>
<div id="touchControls">
  <div class="group">
    <button class="btn" id="leftBtn" aria-label="Move left">◀</button>
    <button class="btn" id="rightBtn" aria-label="Move right">▶</button>
    <button class="btn" id="downBtn" aria-label="Enter pipe">▼</button>
  </div>
  <div class="group">
    <button class="btn" id="jumpBtn" aria-label="Jump">JUMP</button>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {alpha:false});
ctx.imageSmoothingEnabled = false;

const VW = 960, VH = 540;
let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

function resizeCanvas(){
  const w = window.innerWidth;
  const h = window.innerHeight;

  const scale = Math.min(w / VW, h / VH);
  const cssW = Math.floor(VW * scale);
  const cssH = Math.floor(VH * scale);

  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";

  canvas.width = Math.floor(VW * dpr);
  canvas.height = Math.floor(VH * dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", ()=>setTimeout(resizeCanvas,150));
resizeCanvas();

const TILE = 48;
const GRAV = 2100;
const SPEED = 420;
const JUMP = 850;
const FLOOR_Y = 10*TILE;
const MAIN_W = 150*TILE;

const keys = {};
const touch = {left:false,right:false,down:false,jump:false};

window.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key.toLowerCase()==="r") resetGame();
});
window.addEventListener("keyup", e=>keys[e.key.toLowerCase()] = false);

function bindHold(id, key){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[key] = true; el.classList.add("active"); };
  const off = e => { e.preventDefault(); touch[key] = false; el.classList.remove("active"); };

  el.addEventListener("pointerdown", on, {passive:false});
  el.addEventListener("pointerup", off, {passive:false});
  el.addEventListener("pointercancel", off, {passive:false});
  el.addEventListener("pointerleave", off, {passive:false});

  el.addEventListener("touchstart", on, {passive:false});
  el.addEventListener("touchend", off, {passive:false});
  el.addEventListener("touchcancel", off, {passive:false});
}
bindHold("leftBtn","left");
bindHold("rightBtn","right");
bindHold("downBtn","down");
bindHold("jumpBtn","jump");

document.getElementById("restartBtn").addEventListener("click", e=>{
  e.preventDefault();
  resetGame();
});

let solids=[], mysteries=[], coins=[], enemies=[], spikes=[], cannons=[], bullets=[], pipes=[], powerups=[];
let player, room="main", cameraX=0, score=0, won=false, gameOver=false, msg="", msgTimer=0, lastShot=0;

function addSolid(room,x,y,w=TILE,h=TILE,type="ground"){solids.push({room,x,y,w,h,type});}
function addCoin(room,x,y){coins.push({room,x,y,r:11,taken:false});}
function addEnemy(room,x,y,kind="walker"){
  if(kind==="turtle"){
    enemies.push({room,x,y,w:38,h:44,vx:-68,vy:0,alive:true,kind,stomped:false});
  }else{
    enemies.push({room,x,y,w:36,h:34,vx:-75,vy:0,alive:true,kind});
  }
}
function addSpike(room,x,y){spikes.push({room,x,y,w:40,h:32});}
function addMystery(room,x,y,kind){mysteries.push({room,x,y,w:TILE,h:TILE,kind,used:false});}
function addPipe(room,x,y,h,destRoom,destX,destY,secret=false){pipes.push({room,x,y,w:96,h,destRoom,destX,destY,secret});}

function buildLevel(){
  solids=[]; mysteries=[]; coins=[]; enemies=[]; spikes=[]; cannons=[]; bullets=[]; pipes=[]; powerups=[];

  const gaps=[[18,20],[35,37],[57,60],[86,89],[112,115]];
  for(let i=-10;i<150;i++){
    if(i < 0 || !gaps.some(g=>i>=g[0]&&i<g[1])) addSolid("main",i*TILE,FLOOR_Y,TILE,TILE*2,"ground");
  }

  [8,9,10,24,25,26,27,43,44,65,66,67,68,69,95,96,97,122,123,124].forEach(i=>addSolid("main",i*TILE,7*TILE,TILE,TILE,"brick"));
  [14,15,31,32,49,50,76,77,78,102,103,130,131].forEach(i=>addSolid("main",i*TILE,6*TILE,TILE,TILE,"brick"));

  addMystery("main",11*TILE,7*TILE,"coin");
  addMystery("main",28*TILE,7*TILE,"power");
  addMystery("main",45*TILE,6*TILE,"coin");
  addMystery("main",80*TILE,7*TILE,"power");
  addMystery("main",126*TILE,6*TILE,"coin");

  [[5,8],[6,8],[7,8],[19,6],[20,5],[21,6],[39,8],[40,7],[41,8],[58,5],[59,4],[60,5],[73,6],[74,6],[75,6],[90,7],[91,6],[92,7],[108,8],[109,7],[110,8],[135,7],[136,7],[137,7]]
  .forEach(([x,y])=>addCoin("main",x*TILE+24,y*TILE+20));

  [16,23,33,47,63,82,99,106,128,140].forEach(i=>addEnemy("main",i*TILE+6,FLOOR_Y-34));
  [42,74,118].forEach(i=>addEnemy("main",i*TILE+5,FLOOR_Y-44,"turtle"));
  [29,30,52,61,62,84,100,101,116,132].forEach(i=>addSpike("main",i*TILE+4,FLOOR_Y-30));

  // Wooden bridge near the midpoint.
  for(let i=70;i<=78;i++) addSolid("main",i*TILE,8.65*TILE,TILE,18,"wood");

  cannons.push({room:"main",x:54*TILE,y:FLOOR_Y-64,w:44,h:64,dir:-1});
  cannons.push({room:"main",x:93*TILE,y:FLOOR_Y-64,w:44,h:64,dir:-1});
  cannons.push({room:"main",x:133*TILE,y:FLOOR_Y-64,w:44,h:64,dir:-1});

  addPipe("main",38*TILE,FLOOR_Y-96,96,"coinroom",8*TILE,8*TILE,false);
  addPipe("main",-5*TILE,FLOOR_Y-96,96,"main",143*TILE,FLOOR_Y-46,true);

  for(let i=0;i<24;i++) addSolid("coinroom",i*TILE,FLOOR_Y,TILE,TILE*2,"ground");
  addSolid("coinroom",0,0,TILE,10*TILE,"wall");
  addSolid("coinroom",23*TILE,0,TILE,10*TILE,"wall");

  for(let r=0;r<4;r++){
    for(let c=0;c<10;c++){
      addCoin("coinroom",(5+c)*TILE+24,(3+r)*TILE+22);
    }
  }
  addSolid("coinroom",4*TILE,8*TILE,TILE*12,TILE,"brick");
  addSolid("coinroom",7*TILE,5*TILE,TILE*6,TILE,"brick");
  addMystery("coinroom",10*TILE,4*TILE,"power");
  addPipe("coinroom",18*TILE,FLOOR_Y-96,96,"main",78*TILE,FLOOR_Y-46,false);
}

function resetGame(){
  buildLevel();
  room="main";
  cameraX=0;
  score=0;
  won=false;
  gameOver=false;
  msg="";
  msgTimer=0;
  lastShot=0;
  player={x:2*TILE,y:FLOOR_Y-46,w:34,h:46,vx:0,vy:0,grounded:false,coyote:0,jumpLock:false,big:false,face:1};
}
resetGame();

function active(o){return o.room===room;}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function pbox(){return {x:player.x,y:player.y,w:player.w,h:player.h};}

function allSolids(){
  return [
    ...solids.filter(active),
    ...mysteries.filter(active),
    ...pipes.filter(active)
  ];
}

function hitMystery(m){
  if(m.used) return;
  m.used=true;
  score+=100;
  if(m.kind==="coin"){
    score+=200; msg="COIN BLOCK!"; msgTimer=1;
  } else {
    powerups.push({room,x:m.x+10,y:m.y-30,w:28,h:28,vx:60,vy:-180,taken:false});
    msg="POWER-UP!"; msgTimer=1.2;
  }
}

function moveX(o,dt){
  o.x += o.vx*dt;
  for(const b of allSolids()){
    if(overlap(o,b)){
      if(o.vx>0) o.x=b.x-o.w;
      else if(o.vx<0) o.x=b.x+b.w;
      o.vx=0;
    }
  }
}
function moveY(o,dt,isPlayer=false){
  o.y += o.vy*dt;
  o.grounded=false;
  for(const b of allSolids()){
    if(overlap(o,b)){
      if(o.vy>0){
        o.y=b.y-o.h; o.vy=0; o.grounded=true;
      }else if(o.vy<0){
        o.y=b.y+b.h; o.vy=0;
        if(isPlayer && mysteries.includes(b)) hitMystery(b);
      }
    }
  }
}

function enterPipe(p){
  room=p.destRoom;
  player.x=p.destX; player.y=p.destY;
  player.vx=0; player.vy=0;
  cameraX=Math.max(-10*TILE,player.x-VW*.42);
  msg=p.secret?"SECRET DEV WARP!":"PIPE WARP!";
  msgTimer=1.2;
}

function hurt(){
  if(player.big){
    player.big=false;
    player.h=46;
    msg="POWER LOST";
    msgTimer=1;
  }else{
    gameOver=true;
  }
}

function update(dt,t){
  if(won||gameOver) return;

  const left=keys["a"]||keys["arrowleft"]||touch.left;
  const right=keys["d"]||keys["arrowright"]||touch.right;
  const down=keys["s"]||keys["arrowdown"]||touch.down;
  const jump=keys["w"]||keys["arrowup"]||keys[" "]||touch.jump;

  if(left){player.vx-=1900*dt;player.face=-1;}
  if(right){player.vx+=1900*dt;player.face=1;}

  player.vx*=Math.pow(.84,dt*60);
  player.vx=Math.max(-SPEED,Math.min(SPEED,player.vx));

  if(player.grounded) player.coyote=.12;
  else player.coyote-=dt;

  if(jump&&!player.jumpLock&&player.coyote>0){
    player.vy=-JUMP;
    player.grounded=false;
    player.coyote=0;
    player.jumpLock=true;
  }
  if(!jump) player.jumpLock=false;

  player.vy=Math.min(player.vy+GRAV*dt,1000);

  moveX(player,dt);
  moveY(player,dt,true);

  if(down && player.grounded){
    for(const p of pipes.filter(active)){
      const feet=player.y+player.h;
      if(Math.abs(feet-p.y)<8 && player.x+player.w>p.x+8 && player.x<p.x+p.w-8){
        enterPipe(p);
        break;
      }
    }
  }

  for(const c of coins.filter(active)){
    if(!c.taken && overlap(pbox(),{x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})){
      c.taken=true; score+=100;
    }
  }

  for(const q of powerups.filter(active)){
    if(q.taken) continue;
    q.vy+=GRAV*dt;
    q.x+=q.vx*dt;
    q.y+=q.vy*dt;
    for(const b of solids.filter(active)){
      if(overlap(q,b)&&q.vy>0){q.y=b.y-q.h;q.vy=0;}
    }
    if(overlap(pbox(),q)){
      q.taken=true;
      player.big=true;
      player.h=60;
      score+=500;
      msg="SUPER MODE!";
      msgTimer=1.2;
    }
  }

  for(const e of enemies.filter(active)){
    if(!e.alive) continue;
    e.vy+=GRAV*dt;
    e.x+=e.vx*dt;
    let hitWall=false;
    for(const b of solids.filter(active)){
      if(overlap(e,b)){
        if(e.vx>0)e.x=b.x-e.w; else e.x=b.x+b.w;
        hitWall=true;
      }
    }
    if(hitWall) e.vx*=-1;
    e.y+=e.vy*dt;
    for(const b of solids.filter(active)){
      if(overlap(e,b)&&e.vy>0){e.y=b.y-e.h;e.vy=0;}
    }
    if(overlap(pbox(),e)){
      const prevBottom=player.y+player.h-player.vy*dt;
      if(player.vy>0 && prevBottom<=e.y+12){
        if(e.kind==="turtle" && !e.stomped){
          e.stomped=true;
          e.h=26;
          e.y+=18;
          e.vx=0;
          player.vy=-430;
          score+=250;
        }else{
          e.alive=false;
          player.vy=-430;
          score+=e.kind==="turtle"?350:200;
        }
      }else{
        hurt();
      }
    }
  }

  for(const s of spikes.filter(active)){
    if(overlap(pbox(),s)) hurt();
  }

  if(t-lastShot>1.7){
    for(const c of cannons.filter(active)){
      bullets.push({room,x:c.x,y:c.y+16,w:30,h:20,vx:c.dir*260,dead:false});
    }
    lastShot=t;
  }
  for(const b of bullets.filter(active)){
    b.x+=b.vx*dt;
    if(overlap(pbox(),b)){b.dead=true;hurt();}
  }
  bullets=bullets.filter(b=>!b.dead && Math.abs(b.x-player.x)<1800);

  if(room==="main" && player.x>146*TILE){
    won=true; score+=2000;
  }
  if(player.y>900) gameOver=true;
  if(msgTimer>0) msgTimer-=dt;

  const worldW=room==="main"?MAIN_W:24*TILE;
  const target=player.x-VW*.42;
  cameraX+=(target-cameraX)*Math.min(1,dt*5);
  cameraX=Math.max(room==="main"?-10*TILE:0,Math.min(worldW-VW,cameraX));
}

function drawCloud(x,y,s){
  ctx.fillStyle="#fff";
  ctx.fillRect(x,y+18*s,90*s,22*s);
  ctx.fillRect(x+18*s,y,35*s,35*s);
  ctx.fillRect(x+48*s,y+7*s,30*s,30*s);
}
function drawBackground(){
  if(room==="coinroom"){
    ctx.fillStyle="#201a3a";ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle="#3b315f";
    for(let x=0;x<VW;x+=64)for(let y=0;y<VH;y+=64)ctx.fillRect(x+6,y+6,52,52);
    return;
  }
  ctx.fillStyle="#69c6ff";ctx.fillRect(0,0,VW,VH);
  const p=cameraX*.18;
  drawCloud(120-p%1200,75,1);
  drawCloud(540-p%1200,135,.8);
  drawCloud(930-p%1200,60,1.1);
  ctx.fillStyle="#7bcb54";
  for(let i=-1;i<7;i++){
    let x=i*250-(cameraX*.3)%250;
    ctx.beginPath();
    ctx.moveTo(x,492);ctx.lineTo(x+125,320);ctx.lineTo(x+250,492);ctx.fill();
  }
}
function drawSolid(b){
  const x=b.x-cameraX,y=b.y;
  if(b.type==="brick"){
    ctx.fillStyle="#cc6a2d";ctx.fillRect(x,y,b.w,b.h);
    ctx.strokeStyle="#77371d";ctx.lineWidth=3;ctx.strokeRect(x+2,y+2,b.w-4,b.h-4);
    ctx.beginPath();ctx.moveTo(x,y+24);ctx.lineTo(x+b.w,y+24);ctx.stroke();
  }else{
    ctx.fillStyle="#855324";ctx.fillRect(x,y,b.w,b.h);
    ctx.fillStyle="#4cad3f";ctx.fillRect(x,y,b.w,9);
  }
}
function drawMystery(m){
  const x=m.x-cameraX,y=m.y;
  ctx.fillStyle=m.used?"#8f7c61":"#f3bb25";ctx.fillRect(x,y,TILE,TILE);
  ctx.strokeStyle="#815b16";ctx.lineWidth=3;ctx.strokeRect(x+2,y+2,TILE-4,TILE-4);
  ctx.fillStyle=m.used?"#5b5145":"#fff";
  ctx.font="bold 28px Arial";ctx.textAlign="center";ctx.fillText("?",x+24,y+34);
}
function drawCoin(c,t){
  if(c.taken)return;
  const x=c.x-cameraX,y=c.y+Math.sin(t*6+c.x*.01)*3;
  ctx.fillStyle="#ffd53a";ctx.fillRect(x-7,y-13,14,26);
  ctx.fillStyle="#fff0a3";ctx.fillRect(x-2,y-9,3,18);
}
function drawEnemy(e){
  if(!e.alive)return;
  const x=e.x-cameraX,y=e.y;
  if(e.kind==="turtle"){
    if(e.stomped){
      ctx.fillStyle="#2d8e48";ctx.fillRect(x+3,y+3,32,20);
      ctx.fillStyle="#1b5e31";ctx.fillRect(x+8,y,22,6);
      ctx.fillStyle="#f1d493";ctx.fillRect(x+7,y+20,24,5);
    }else{
      ctx.fillStyle="#2d8e48";ctx.fillRect(x+5,y+14,28,24);
      ctx.fillStyle="#1b5e31";ctx.fillRect(x+10,y+9,19,8);
      ctx.fillStyle="#f1d493";ctx.fillRect(x+8,y,22,16);
      ctx.fillStyle="#fff";ctx.fillRect(x+20,y+4,6,6);
      ctx.fillStyle="#111";ctx.fillRect(x+23,y+5,3,4);
      ctx.fillStyle="#d5b16d";ctx.fillRect(x+3,y+36,12,8);ctx.fillRect(x+24,y+36,12,8);
    }
    return;
  }
  ctx.fillStyle="#7d4428";ctx.fillRect(x+3,y+7,30,25);
  ctx.fillStyle="#4d2818";ctx.fillRect(x,y+26,13,8);ctx.fillRect(x+23,y+26,13,8);
  ctx.fillStyle="#fff";ctx.fillRect(x+7,y+11,7,7);ctx.fillRect(x+22,y+11,7,7);
}
function drawSpike(s){
  const x=s.x-cameraX,y=s.y;
  ctx.fillStyle="#d9d9df";
  ctx.beginPath();ctx.moveTo(x,y+s.h);ctx.lineTo(x+s.w/2,y);ctx.lineTo(x+s.w,y+s.h);ctx.closePath();ctx.fill();
}
function drawPipe(p){
  const x=p.x-cameraX,y=p.y;
  ctx.fillStyle=p.secret?"#7a42d1":"#19a94b";ctx.fillRect(x+12,y+18,p.w-24,p.h-18);
  ctx.fillStyle=p.secret?"#9a63ea":"#37ca67";ctx.fillRect(x,y,p.w,24);
}
function drawCannon(c){
  const x=c.x-cameraX,y=c.y;
  ctx.fillStyle="#444";ctx.fillRect(x+7,y,30,64);
  ctx.fillStyle="#222";ctx.fillRect(x,y,44,24);
}
function drawBullet(b){
  const x=b.x-cameraX,y=b.y;
  ctx.fillStyle="#202020";ctx.fillRect(x,y,b.w,b.h);
  ctx.fillStyle="#fff";ctx.fillRect(x+4,y+5,6,5);
}
function drawPower(q){
  if(q.taken)return;
  const x=q.x-cameraX,y=q.y;
  ctx.fillStyle="#f05c45";ctx.fillRect(x,y,q.w,q.h);
  ctx.fillStyle="#fff";ctx.fillRect(x+5,y+5,7,7);ctx.fillRect(x+17,y+5,7,7);
}
function drawFlag(){
  if(room!=="main")return;
  const x=147*TILE-cameraX,y=5*TILE;
  ctx.fillStyle="#ddd";ctx.fillRect(x,y,7,5*TILE);
  ctx.fillStyle="#7b3cff";ctx.fillRect(x+7,y+8,54,30);
  ctx.fillStyle="#fff";ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.fillText("GO!",x+34,y+29);
}
function drawPlayer(){
  const x=Math.round(player.x-cameraX),y=Math.round(player.y);
  ctx.fillStyle="#0e8c8c";ctx.fillRect(x+5,y,24,8);ctx.fillRect(x+1,y+7,32,7);
  ctx.fillStyle="#f0b27a";ctx.fillRect(x+8,y+14,20,12);
  ctx.fillStyle="#f2c94c";ctx.fillRect(x+5,y+26,24,player.big?24:12);
  ctx.fillStyle="#146b8c";ctx.fillRect(x+7,y+(player.big?46:34),20,8);
  ctx.fillStyle="#2b1d19";ctx.fillRect(x+4,y+player.h-5,10,5);ctx.fillRect(x+20,y+player.h-5,10,5);
}

function starCount(){
  const total=coins.length;
  if(total===0) return 0;
  const got=coins.filter(c=>c.taken).length;
  const pct=got/total;
  if(pct>=.90) return 3;
  if(pct>=.60) return 2;
  if(pct>=.30) return 1;
  return 0;
}

function starText(){
  const n=starCount();
  return "★".repeat(n)+"☆".repeat(3-n);
}

function render(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBackground();
  solids.filter(active).forEach(drawSolid);
  mysteries.filter(active).forEach(drawMystery);
  coins.filter(active).forEach(c=>drawCoin(c,t));
  pipes.filter(active).forEach(drawPipe);
  spikes.filter(active).forEach(drawSpike);
  cannons.filter(active).forEach(drawCannon);
  bullets.filter(active).forEach(drawBullet);
  enemies.filter(active).forEach(drawEnemy);
  powerups.filter(active).forEach(drawPower);
  drawFlag();
  drawPlayer();

  if(msgTimer>0){
    ctx.fillStyle="#0009";ctx.fillRect(VW/2-140,55,280,46);
    ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.textAlign="center";ctx.fillText(msg,VW/2,86);
  }
  if(won||gameOver){
    ctx.fillStyle="#0009";ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle="#fff";ctx.font="bold 52px Arial";ctx.textAlign="center";
    ctx.fillText(won?"MISSION COMPLETE!":"YOU GOT BONKED!",VW/2,220);
    ctx.font="bold 40px Arial";ctx.fillStyle="#ffd53a";ctx.fillText(starText(),VW/2,270);
    ctx.fillStyle="#fff";ctx.font="20px Arial";
    ctx.fillText(`COIN RATING: ${starCount()}/3`,VW/2,305);
    ctx.font="18px Arial";ctx.fillText("Tap ↻ RESTART to play again",VW/2,338);
  }

  const got=coins.filter(c=>c.taken).length,total=coins.length;
  document.getElementById("hud").textContent=`LEVEL 1  SCORE ${score}  COINS ${got}/${total}  STARS ${starText()}  ${room==="coinroom"?"BONUS ROOM":"MAIN"}`;
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.033);
  last=now;
  update(dt,now/1000);
  render(now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
